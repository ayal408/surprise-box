<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>מעבדת חיפוש בינארי</title><style>*{box-sizing:border-box}body{margin:0;padding:22px 14px;background:radial-gradient(circle at 80% 0,#203a59,transparent 55%),#0b0e14;color:#e6edf3;font:16px/1.5 "Segoe UI",Arial,sans-serif}.wrap{max-width:1060px;margin:auto}a{color:#9bd1ff}h1{color:#58d68d;margin:6px 0}p{color:#aab7c8}.panel{background:#121722;border:1px solid #304056;border-radius:15px;padding:16px;margin:14px 0}.row{display:flex;flex-wrap:wrap;align-items:center;gap:9px}input,button,select{font:inherit;background:#1a2332;color:#e6edf3;border:1px solid #40516a;border-radius:9px;padding:8px}button{cursor:pointer}button:hover{background:#304962}:focus-visible{outline:2px solid #58d68d;outline-offset:2px}code{font-family:Consolas,monospace;direction:ltr;unicode-bidi:isolate}.status{min-height:1.5em;color:#ffd166}.scroll{overflow:auto}@media(max-width:650px){.panel{padding:10px}}.cells{display:flex;gap:4px;direction:ltr;justify-content:center;min-width:max-content;padding:14px 0}.cell{width:46px;height:70px;border:1px solid #587089;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1b293a;font:700 18px Consolas,monospace}.cell small{font:12px Arial;color:#91a4bb}.cell.off{opacity:.28}.cell.mid{border:3px solid #ffd166;background:#524521}.cell.found{background:#1f694f;border-color:#58d68d}.pointers{display:flex;gap:8px;flex-wrap:wrap}.pointers b{background:#26425c;padding:5px 9px;border-radius:7px}.lines{font:15px/1.8 Consolas,monospace;direction:ltr;text-align:left;background:#090d15;padding:12px;border-radius:8px}.lines div.active{background:#264c43;color:#a5ffcd}input[type=number]{width:100px}</style></head><body><main class="wrap"><a href="התחל כאן.html#algorithms">← אלגוריתמים בתנועה</a><h1>🔎 חיפוש בינארי בתנועה</h1><p>בכל צעד בודקים את האמצע וזורקים חצי מהערכים. התהליך עובד רק כשהרשימה ממוינת.</p><section class="panel"><div class="row"><label>מספר לחיפוש <input id="target" type="number" value="34"></label><button id="start">חיפוש חדש</button><button id="step">הצעד הבא</button><button id="auto">▶ הפעלה</button><button id="reset">↺ איפוס</button><button id="shuffle">🎲 רשימה חדשה</button></div><p>לחצו על מספר ברשימה כדי לבחור אותו כיעד; אפשר לנסות גם מספר שאינו קיים.</p><div class="scroll"><div id="cells" class="cells"></div></div><div id="pointers" class="pointers"></div><p id="status" class="status" role="status"></p><p id="stats"></p></section><section class="panel"><h2>הקוד בצעדים</h2><div class="lines" id="code"></div><p>זמן ריצה: <code>O(log n)</code> כי בכל צעד נשאר לכל היותר חצי מטווח החיפוש. זיכרון נוסף: <code>O(1)</code>.</p></section></main><script>
const $=id=>document.getElementById(id);let values=[3,7,11,15,20,23,27,30,34,38,42,47,53,60,68],low,high,mid,checks,done,timer=null,phase;const lines=['low = 0; high = n - 1','while low <= high:','  mid = floor((low + high) / 2)','  if a[mid] == target: return mid','  if a[mid] < target: low = mid + 1','  else: high = mid - 1','return -1'];function stop(){if(timer){clearInterval(timer);timer=null}$('auto').textContent='▶ הפעלה'}function paint(message){const target=Number($('target').value);$('cells').replaceChildren(...values.map((v,i)=>{const b=document.createElement('button');b.type='button';b.className='cell'+(done&&i===mid&&v===target?' found':i===mid&&i>=low&&i<=high?' mid':i<low||i>high?' off':'');b.innerHTML='<small>'+i+'</small>';b.append(document.createTextNode(v));b.onclick=()=>{$('target').value=v;start()};return b}));$('pointers').replaceChildren();for(const [name,value] of [['low',low],['mid',mid],['high',high]]){const b=document.createElement('b');b.textContent=name+' = '+(value===null?'—':value);$('pointers').append(b)}$('status').textContent=message;$('stats').textContent=checks+' השוואות מתוך '+values.length+' ערכים';$('code').replaceChildren(...lines.map((line,i)=>{const d=document.createElement('div');d.textContent=line;if(i===phase)d.className='active';return d}))}function start(){stop();if($('target').value.trim()===''){ $('status').textContent='הכניסו מספר לחיפוש.';return}low=0;high=values.length-1;mid=null;checks=0;done=false;phase=0;paint('טווח החיפוש הראשוני מסומן. לחצו על הצעד הבא.')}function step(){if(done)return;if($('target').value.trim()===''){start();return}if(low>high){done=true;mid=null;phase=6;stop();paint('המספר לא נמצא: טווח החיפוש התרוקן.');return}mid=Math.floor((low+high)/2);checks++;const target=Number($('target').value);if(values[mid]===target){done=true;phase=3;stop();paint('נמצא! הערך '+target+' באינדקס '+mid+'.');return}if(values[mid]<target){const previous=mid;low=mid+1;phase=4;paint('האמצע '+values[previous]+' קטן מהיעד. ממשיכים בחצי הימני.')}else{const previous=mid;high=mid-1;phase=5;paint('האמצע '+values[previous]+' גדול מהיעד. ממשיכים בחצי השמאלי.')}}$('start').onclick=start;$('reset').onclick=start;$('step').onclick=step;$('auto').onclick=()=>{if(timer){stop();return}if(done)start();timer=setInterval(()=>{step();if(done)stop()},750);$('auto').textContent='⏸ עצירה'};$('shuffle').onclick=()=>{const set=new Set();while(set.size<15)set.add(1+Math.floor(Math.random()*90));values=[...set].sort((a,b)=>a-b);$('target').value=values[Math.floor(values.length/2)];start()};start();
</script><script src="dl.js" defer></script></body></html>
