<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מגדיל מתכונים</title>
<style>
:root{--bg:#0f0c24;--ink:#f3efff;--muted:#a9a3c9;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--acc:#ffc6a5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#3b1d7a 0%,transparent 55%),radial-gradient(circle at 0% 100%,#5a1d4a 0%,transparent 45%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;padding:20px 16px 40px;display:flex;justify-content:center}
.wrap{width:100%;max-width:860px;display:flex;flex-direction:column;gap:16px}
a.back{color:var(--muted);text-decoration:none;font-size:.9rem}
a.back:hover{color:var(--ink)}
h1{margin:0;font-size:clamp(1.8rem,5vw,2.5rem);color:var(--acc)}
h2{margin:0 0 10px;font-size:1.15rem}
p.sub{margin:-8px 0 0;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:.9rem}
label.inline{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
input,select,textarea{font:inherit;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
select option{background:#1d1840}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--acc)}
input[type=color]{padding:2px;height:40px;width:56px}
textarea{resize:vertical}
button{font:inherit;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 15px;font-weight:600;transition:background .15s,transform .1s}
button:hover{background:rgba(255,255,255,.12)}
button:active{transform:scale(.97)}
button.pri,button.on{background:var(--acc);color:#140f2b;border-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center}
.stat small{display:block;color:var(--muted);font-size:.8rem}
.stat b{font-size:1.45rem;color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--muted);font-weight:600}
.num{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:.85rem;margin:0;line-height:1.6}
.tag{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#src{width:100%;min-height:220px;line-height:1.7}
.out{line-height:2;font-size:1.05rem}
.out .q{color:var(--acc);font-weight:700}
.out li{cursor:pointer}
.out li.done{text-decoration:line-through;opacity:.45}
.mul{font-size:2rem;font-weight:800;color:var(--acc);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="התחל כאן.html">→ חזרה לקופסת ההפתעות</a>
  <h1>🍰 מגדיל ומקטין מתכונים</h1>
<p class="sub">מדביקים מתכון ומשנים את מספר המנות או את גודל התבנית, והכמויות מתעדכנות. יש גם המרה מכוסות לגרמים.</p>
<div class="grid2">
  <div class="panel">
    <h2>המתכון המקורי</h2>
    <textarea id="src"></textarea>
  </div>
  <div class="panel">
    <h2>קנה מידה</h2>
    <div class="row"><button class="md on" data-m="serv">🍽️ לפי מנות</button><button class="md" data-m="pan">⭕ לפי תבנית</button><button class="md" data-m="x">✖️ לפי מכפיל</button></div>
    <div id="m-serv" class="row" style="margin-top:10px"><label style="flex:1">מנות במקור<input id="s0" type="number" value="4" min="1"></label><label style="flex:1">מנות רצויות<input id="s1" type="number" value="6" min="1"></label></div>
    <div id="m-pan" class="row" style="margin-top:10px;display:none"><label style="flex:1">קוטר תבנית מקורית (ס״מ)<input id="p0" type="number" value="24"></label><label style="flex:1">קוטר רצוי<input id="p1" type="number" value="28"></label><label style="flex:1">או תבנית מלבנית רצויה<input id="rect" placeholder="למשל 20x30"></label></div>
    <div id="m-x" class="row" style="margin-top:10px;display:none"><div class="row"><button class="xm" data-x="0.5">½</button><button class="xm" data-x="1.5">×1.5</button><button class="xm" data-x="2">×2</button><button class="xm" data-x="3">×3</button></div><input id="xv" type="number" value="2" step="0.25" style="width:90px"></div>
    <div class="mul" id="mul"></div>
    <ul class="out" id="out"></ul>
    <div class="row"><button class="pri" id="copy">📋 העתקה</button><button onclick="print()">🖨️ הדפסה</button></div>
  </div>
</div>
<div class="panel">
  <h2>⚖️ המרה מכוסות לגרמים</h2>
  <div class="row"><input id="cq" type="number" value="1" step="0.25" style="width:90px"><select id="cu"><option value="240">כוס</option><option value="15">כף</option><option value="5">כפית</option></select><select id="ci"></select><b id="cr" style="font-size:1.3rem;color:var(--acc)"></b></div>
  <p class="hint" style="margin-top:8px">ערכים ממוצעים. כוס = 240 מ״ל. הצפיפות משתנה לפי מותג ואופן המילוי.</p>
</div>
<script>
const $=id=>document.getElementById(id);let M='serv';
const DENS={'קמח לבן':.53,'קמח מלא':.5,'סוכר לבן':.83,'סוכר חום':.8,'אבקת סוכר':.5,'חמאה':.95,'שמן':.9,'מים / חלב':1,'אורז':.8,'שיבולת שועל':.37,'קקאו':.42,'דבש':1.42,'אגוזים קצוצים':.5,'שוקולד צ׳יפס':.7,'מלח':1.2,'שמרים יבשים':.6,'אבקת אפייה':.9};
$('ci').innerHTML=Object.keys(DENS).map(k=>`<option>${k}</option>`).join('');
const FR={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125};
const WORDS={'חצי':.5,'רבע':.25,'שלושת רבעי':.75,'שליש':1/3};
function nice(v){if(v>=10)return String(Math.round(v));const w=Math.floor(v),r=v-w;const fr=[[0,''],[.125,'⅛'],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾'],[1,'']].reduce((a,b)=>Math.abs(b[0]-r)<Math.abs(a[0]-r)?b:a);
  const W=fr[0]===1?w+1:w;if(Math.abs(fr[0]-r)>.06)return(+v.toFixed(2)).toString();return(W?W+(fr[1]?' ':''):'')+fr[1]||'0'}
function mult(){if(M==='serv')return(+$('s1').value||1)/(+$('s0').value||1);
  if(M==='pan'){const d0=+$('p0').value||1,a0=Math.PI*(d0/2)**2,rm=/(\d+(?:\.\d+)?)\s*[x×*]\s*(\d+(?:\.\d+)?)/.exec($('rect').value);if(rm)return rm[1]*rm[2]/a0;return((+$('p1').value||d0)/d0)**2}
  return +$('xv').value||1}
function scale(line,k){let used=false;
  line=line.replace(/(\d+(?:\.\d+)?)\s*([½¼¾⅓⅔⅛])|(\d+)\/(\d+)|(\d+(?:\.\d+)?)|([½¼¾⅓⅔⅛])/,(m,a,b,n,d,x,u)=>{used=true;const v=a?+a+FR[b]:n?n/d:x?+x:FR[u];return`<span class="q">${nice(v*k)}</span>`});
  if(!used)for(const[w,v]of Object.entries(WORDS))if(line.startsWith(w+' ')){line=`<span class="q">${nice(v*k)}</span>`+line.slice(w.length);used=true;break}
  return line}
function calc(){const k=mult();$('mul').textContent='×'+(+k.toFixed(2));
  $('out').innerHTML=$('src').value.split('\n').filter(l=>l.trim()).map(l=>`<li>${scale(l.replace(/</g,'&lt;'),k)}</li>`).join('');
  try{localStorage.setItem('recipe',JSON.stringify([$('src').value,$('s0').value,$('s1').value]))}catch{}}
function conv(){const g=(+$('cq').value||0)*(+$('cu').value)*DENS[$('ci').value];$('cr').textContent='= '+Math.round(g)+' גרם'}
document.querySelectorAll('.md').forEach(b=>b.onclick=()=>{M=b.dataset.m;document.querySelectorAll('.md').forEach(x=>x.classList.toggle('on',x===b));['serv','pan','x'].forEach(m=>$('m-'+m).style.display=m===M?'':'none');calc()});
document.querySelectorAll('.xm').forEach(b=>b.onclick=()=>{$('xv').value=b.dataset.x;calc()});
['src','s0','s1','p0','p1','rect','xv'].forEach(k=>$(k).oninput=calc);['cq','cu','ci'].forEach(k=>$(k).oninput=conv);
$('out').onclick=e=>{const li=e.target.closest('li');li&&li.classList.toggle('done')};
$('copy').onclick=()=>{navigator.clipboard.writeText([...$('out').children].map(l=>'• '+l.textContent).join('\n'));$('copy').textContent='✓ הועתק';setTimeout(()=>$('copy').textContent='📋 העתקה',1400)};
let s;try{s=JSON.parse(localStorage.getItem('recipe'))}catch{}
$('src').value=s?s[0]:'עוגת שוקולד (4 מנות)\n2 כוסות קמח\n1½ כוסות סוכר\n¾ כוס קקאו\n2 ביצים\n1 כוס חלב\n½ כוס שמן\n1 כפית אבקת אפייה\nחצי כפית מלח\n200 גרם שוקולד מריר';
if(s){$('s0').value=s[1];$('s1').value=s[2]}
calc();conv();
</script>
</div>
<script src="dl.js" defer></script>
</body>
</html>
