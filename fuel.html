<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עלות נסיעה</title>
<style>
:root{--bg:#0f0c24;--ink:#f3efff;--muted:#a9a3c9;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--acc:#ff9f43}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#3b1d7a 0%,transparent 55%),radial-gradient(circle at 0% 100%,#5a1d4a 0%,transparent 45%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;padding:20px 16px 40px;display:flex;justify-content:center}
.wrap{width:100%;max-width:860px;display:flex;flex-direction:column;gap:16px}
a.back{color:var(--muted);text-decoration:none;font-size:.9rem}
a.back:hover{color:var(--ink)}
h1{margin:0;font-size:clamp(1.8rem,5vw,2.5rem);color:var(--acc)}
h2{margin:0 0 10px;font-size:1.15rem}
p.sub{margin:-8px 0 0;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:.9rem}
label.inline{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
input,select,textarea{font:inherit;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
select option{background:#1d1840}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--acc)}
input[type=color]{padding:2px;height:40px;width:56px}
textarea{resize:vertical}
button{font:inherit;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 15px;font-weight:600;transition:background .15s,transform .1s}
button:hover{background:rgba(255,255,255,.12)}
button:active{transform:scale(.97)}
button.pri,button.on{background:var(--acc);color:#140f2b;border-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center}
.stat small{display:block;color:var(--muted);font-size:.8rem}
.stat b{font-size:1.45rem;color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--muted);font-weight:600}
.num{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:.85rem;margin:0;line-height:1.6}
.tag{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="התחל כאן.html">→ חזרה לקופסת ההפתעות</a>
  <h1>🚗 מחשבון עלות נסיעה</h1>
<p class="sub">כמה תעלה הנסיעה בדלק או בחשמל, כולל כבישי אגרה וחניה, כמה זה יוצא לכל נוסע, ואיך זה נראה בחודש.</p>
<div class="grid2">
  <div class="panel">
    <div class="row" style="margin-bottom:10px"><button class="tp on" data-t="gas">⛽ בנזין / סולר</button><button class="tp" data-t="ev">🔌 חשמלי</button></div>
    <label>מרחק בכיוון אחד (ק״מ)<input id="km" type="number" value="85"></label>
    <label class="inline" style="margin-top:8px"><input type="checkbox" id="rt" checked> הלוך ושוב</label>
    <div id="gas">
      <label style="margin-top:8px">צריכה (ק״מ לליטר)<input id="kpl" type="number" value="14" step="0.5"></label>
      <label style="margin-top:8px">מחיר לליטר (₪)<input id="ppl" type="number" value="7.3" step="0.01"></label>
    </div>
    <div id="ev" style="display:none">
      <label style="margin-top:8px">צריכה (קוט״ש ל־100 ק״מ)<input id="kwh" type="number" value="16" step="0.5"></label>
      <label style="margin-top:8px">מחיר לקוט״ש (₪)<input id="pkwh" type="number" value="0.64" step="0.01"></label>
      <div class="row" style="margin-top:6px"><button class="q" data-k="0.64">בבית ~0.64</button><button class="q" data-k="1.9">עמדה מהירה ~1.9</button></div>
    </div>
    <label style="margin-top:8px">אגרה / כביש 6 (₪, לכל הנסיעה)<input id="toll" type="number" value="0"></label>
    <label style="margin-top:8px">חניה (₪)<input id="park" type="number" value="0"></label>
    <label style="margin-top:8px">מספר נוסעים (כולל הנהג)<input id="pax" type="number" value="1" min="1"></label>
  </div>
  <div class="panel">
    <div class="stats">
      <div class="stat"><small>עלות הנסיעה</small><b id="tot"></b></div>
      <div class="stat"><small>לכל נוסע</small><b id="per"></b></div>
      <div class="stat"><small>אנרגיה</small><b id="en"></b></div>
      <div class="stat"><small>עלות לק״מ</small><b id="pkm"></b></div>
    </div>
    <h2 style="margin-top:16px">🗓️ אם זו נסיעה קבועה</h2>
    <label>ימים בחודש<input id="days" type="number" value="20"></label>
    <div class="stats" style="margin-top:10px">
      <div class="stat"><small>בחודש</small><b id="mon"></b></div>
      <div class="stat"><small>בשנה</small><b id="yr"></b></div>
      <div class="stat"><small>CO₂ בשנה</small><b id="co2"></b></div>
    </div>
    <p id="cmp" class="hint" style="margin-top:12px"></p>
  </div>
</div>
<p class="hint">מחירי ברירת המחדל משוערים. עדכנו לפי המחיר בתחנה ותעריף החשמל שלכם.</p>
<script>
const $=id=>document.getElementById(id);let T='gas';
const f=v=>'₪'+(Math.round(v*100)/100).toLocaleString('he-IL',{minimumFractionDigits:v<100?2:0,maximumFractionDigits:v<100?2:0});
const IDS=['km','kpl','ppl','kwh','pkwh','toll','park','pax','days'];
function calc(){const d=(+$('km').value||0)*($('rt').checked?2:1);let e,en,co2;
  if(T==='gas'){const l=d/(+$('kpl').value||1);e=l*(+$('ppl').value||0);en=l.toFixed(1)+' ל׳';co2=l*2.31}else{const k=d*(+$('kwh').value||0)/100;e=k*(+$('pkwh').value||0);en=k.toFixed(1)+' קוט״ש';co2=k*.55}
  const tot=e+(+$('toll').value||0)+(+$('park').value||0),pax=Math.max(1,+$('pax').value||1),days=+$('days').value||0;
  $('tot').textContent=f(tot);$('per').textContent=f(tot/pax);$('en').textContent=en;$('pkm').textContent=d?f(e/d):'—';
  $('mon').textContent=f(tot*days);$('yr').textContent=f(tot*days*11);$('co2').textContent=Math.round(co2*days*11).toLocaleString()+' ק״ג';
  const alt=T==='gas'?d*16/100*.64:d/14*7.3;$('cmp').textContent=T==='gas'?`לשם השוואה: רכב חשמלי ממוצע שנטען בבית היה עולה בערך ${f(alt)} על אותה נסיעה (אנרגיה בלבד).`:`לשם השוואה: רכב בנזין של 14 ק״מ לליטר היה עולה בערך ${f(alt)} על אותה נסיעה (דלק בלבד).`;
  try{localStorage.setItem('fuel',JSON.stringify([T,$('rt').checked,...IDS.map(k=>$(k).value)]))}catch{}}
function setT(t){T=t;document.querySelectorAll('.tp').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('gas').style.display=t==='gas'?'':'none';$('ev').style.display=t==='ev'?'':'none';calc()}
try{const s=JSON.parse(localStorage.getItem('fuel'));if(s){T=s[0];$('rt').checked=s[1];IDS.forEach((k,i)=>$(k).value=s[i+2])}}catch{}
document.querySelectorAll('input').forEach(i=>i.oninput=calc);
document.querySelectorAll('.tp').forEach(b=>b.onclick=()=>setT(b.dataset.t));
document.querySelectorAll('.q').forEach(b=>b.onclick=()=>{$('pkwh').value=b.dataset.k;calc()});
setT(T);
</script>
</div>
</body>
</html>
