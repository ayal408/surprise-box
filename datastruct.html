<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מבני נתונים</title>
<style>
:root{--bg:#0f0c24;--ink:#f3efff;--muted:#a9a3c9;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--acc:#c49bff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#3b1d7a 0%,transparent 55%),radial-gradient(circle at 0% 100%,#5a1d4a 0%,transparent 45%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;padding:20px 16px 40px;display:flex;justify-content:center}
.wrap{width:100%;max-width:860px;display:flex;flex-direction:column;gap:16px}
a.back{color:var(--muted);text-decoration:none;font-size:.9rem}
a.back:hover{color:var(--ink)}
h1{margin:0;font-size:clamp(1.8rem,5vw,2.5rem);color:var(--acc)}
h2{margin:0 0 10px;font-size:1.15rem}
p.sub{margin:-8px 0 0;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:.9rem}
label.inline{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
input,select,textarea{font:inherit;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
select option{background:#1d1840}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--acc)}
input[type=color]{padding:2px;height:40px;width:56px}
textarea{resize:vertical}
button{font:inherit;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 15px;font-weight:600;transition:background .15s,transform .1s}
button:hover{background:rgba(255,255,255,.12)}
button:active{transform:scale(.97)}
button.pri,button.on{background:var(--acc);color:#140f2b;border-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center}
.stat small{display:block;color:var(--muted);font-size:.8rem}
.stat b{font-size:1.45rem;color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--muted);font-weight:600}
.num{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:.85rem;margin:0;line-height:1.6}
.tag{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wrap{max-width:1200px!important}
.vis{min-height:300px;border-radius:14px;background:rgba(0,0,0,.25);padding:16px;display:flex;align-items:center;justify-content:center;overflow:auto;direction:ltr}
.box{min-width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;background:var(--acc);color:#140f2b;animation:pop .35s;position:relative}
.box.hl{background:#ffd166;box-shadow:0 0 0 4px #ffd16655}
.box small{position:absolute;top:-18px;font-size:.7rem;color:var(--muted);font-weight:600}
@keyframes pop{from{transform:scale(0) translateY(-30px);opacity:0}}
.stack{display:flex;flex-direction:column-reverse;gap:6px;align-items:center;border:3px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:8px;min-width:90px;min-height:240px;justify-content:flex-start}
.queue{display:flex;gap:6px;align-items:center;border:3px solid var(--line);border-left:0;border-right:0;padding:10px;min-width:300px;min-height:80px}
.ll{display:flex;align-items:center;gap:0;flex-wrap:wrap;row-gap:30px}
.ll .arr{width:36px;height:2px;background:var(--muted);position:relative;margin:0 2px}.ll .arr::after{content:"";position:absolute;right:-2px;top:-5px;border:6px solid transparent;border-left-color:var(--muted)}
.cx td{font-family:Consolas,monospace}
.log{font-family:Consolas,monospace;font-size:.85rem;max-height:160px;overflow:auto;direction:ltr;text-align:left;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="התחל כאן.html">→ חזרה לקופסת ההפתעות</a>
  <h1>🧱 מעבדת מבני נתונים</h1>
<p class="sub">מחסנית, תור, רשימה מקושרת ועץ חיפוש בינארי, בתנועה. מוסיפים ומוחקים ערכים ורואים בדיוק מה קורה בזיכרון, עם סיבוכיות הזמן של כל פעולה.</p>
<div class="panel row" id="tabs"><button class="on" data-t="stack">📚 מחסנית (Stack)</button><button data-t="queue">🚶 תור (Queue)</button><button data-t="ll">🔗 רשימה מקושרת</button><button data-t="bst">🌳 עץ חיפוש בינארי</button></div>
<div class="grid2" style="grid-template-columns:1fr 320px">
  <div class="panel"><div class="row" id="ctl"></div><div class="vis" id="vis" style="margin-top:10px"></div></div>
  <div class="panel"><h2 id="tt"></h2><p class="hint" id="td" style="line-height:1.7"></p><table class="cx" style="margin-top:8px"><tbody id="cx"></tbody></table><h2 style="margin-top:12px">📜 יומן</h2><div class="log" id="log"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);let T='stack',st=[],q=[],ll=[],bst=null,hl=null;
const rnd=()=>1+Math.random()*99|0;const log=m=>{$('log').innerHTML=`<div>› ${m}</div>`+$('log').innerHTML};const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const INFO={stack:['מחסנית (LIFO)','האחרון שנכנס הוא הראשון שיוצא, כמו ערימת צלחות. משמשת לביטול פעולות (Ctrl+Z), לקריאות לפונקציות ולבדיקת סוגריים.',[['push','O(1)'],['pop','O(1)'],['peek','O(1)'],['חיפוש','O(n)']]],
 queue:['תור (FIFO)','הראשון שנכנס הוא הראשון שיוצא, כמו תור בקופה. משמש לתורי הדפסה, לטיפול בבקשות ולחיפוש לרוחב (BFS).',[['enqueue','O(1)'],['dequeue','O(1)'],['peek','O(1)'],['חיפוש','O(n)']]],
 ll:['רשימה מקושרת','כל איבר מצביע על הבא. הוספה בהתחלה מהירה מאוד, אבל כדי להגיע לאיבר באמצע צריך לעבור על כל הקודמים.',[['הוספה בהתחלה','O(1)'],['הוספה בסוף','O(n)'],['גישה לאינדקס','O(n)'],['מחיקה','O(n)']]],
 bst:['עץ חיפוש בינארי','בכל צומת: הקטנים משמאל, הגדולים מימין. חיפוש מהיר כשהעץ מאוזן, ואיטי כשהוא הופך ל"שרוך" (למשל כשמכניסים מספרים ממוינים).',[['חיפוש','O(log n) / O(n)'],['הוספה','O(log n) / O(n)'],['מחיקה','O(log n) / O(n)'],['סריקה ממוינת','O(n)']]]};
const CTL={stack:[['push','➕ Push'],['pop','➖ Pop'],['peek','👁 Peek']],queue:[['enq','➕ Enqueue'],['deq','➖ Dequeue'],['peek','👁 Peek']],ll:[['addH','➕ בהתחלה'],['addT','➕ בסוף'],['find','🔍 חיפוש'],['del','🗑 מחיקה']],bst:[['ins','➕ הוספה'],['find','🔍 חיפוש'],['del','🗑 מחיקה'],['inorder','📋 סריקה ממוינת'],['rand','🎲 7 אקראיים'],['sorted','📈 1..7 ממוין']]};
function setT(t){T=t;hl=null;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));const[a,b,c]=INFO[t];$('tt').textContent=a;$('td').textContent=b;$('cx').innerHTML=c.map(([o,x])=>`<tr><td>${o}</td><td class="num">${x}</td></tr>`).join('');
  $('ctl').innerHTML=`<input id="val" type="number" placeholder="ערך" style="width:90px">`+CTL[t].map(([k,n])=>`<button data-a="${k}">${n}</button>`).join('')+`<button data-a="clear">🧹</button>`;draw()}
function draw(){const v=$('vis');const B=(x,i,lab)=>`<div class="box ${hl===i?'hl':''}">${lab?`<small>${lab}</small>`:''}${x}</div>`;
  if(T==='stack')v.innerHTML=`<div class="stack">${st.map((x,i)=>B(x,i,i===st.length-1?'top':'')).join('')}</div>`;
  else if(T==='queue')v.innerHTML=`<div style="display:flex;align-items:center;gap:10px"><span class="muted">יציאה ←</span><div class="queue">${q.map((x,i)=>B(x,i,i===0?'front':i===q.length-1?'rear':'')).join('')}</div><span class="muted">← כניסה</span></div>`;
  else if(T==='ll')v.innerHTML=`<div class="ll"><span class="muted" style="margin-right:6px">head →</span>${ll.map((x,i)=>B(x,i)+`<div class="arr"></div>`).join('')}<span class="muted">null</span></div>`;
  else v.innerHTML=bstSvg()}
function bstSvg(){if(!bst)return'<span class="muted">העץ ריק</span>';const pos=[];let k=0;const walk=(n,d)=>{if(!n)return;walk(n.l,d+1);pos.push({n,x:k++,d});walk(n.r,d+1)};walk(bst,0);
  const W=Math.max(300,pos.length*56),H=(Math.max(...pos.map(p=>p.d))+1)*70+20,P=new Map(pos.map(p=>[p.n,[30+p.x*52,36+p.d*70]]));let s=`<svg width="${W}" height="${H}">`;
  pos.forEach(({n})=>{const[a,b]=P.get(n);[n.l,n.r].forEach(c=>{if(c){const[x,y]=P.get(c);s+=`<line x1="${a}" y1="${b}" x2="${x}" y2="${y}" stroke="#a9a3c9" stroke-width="2"/>`}})});
  pos.forEach(({n})=>{const[a,b]=P.get(n);s+=`<circle cx="${a}" cy="${b}" r="22" fill="${hl===n?'#ffd166':'#c49bff'}"/><text x="${a}" y="${b+6}" text-anchor="middle" font-weight="800" font-size="16" fill="#140f2b">${n.v}</text>`});return s+'</svg>'}
const height=n=>n?1+Math.max(height(n.l),height(n.r)):0;
function ins(v){const n={v,l:null,r:null};if(!bst){bst=n;return}let c=bst;while(true){if(v<c.v){if(!c.l){c.l=n;return}c=c.l}else{if(!c.r){c.r=n;return}c=c.r}}}
function delNode(n,v){if(!n)return null;if(v<n.v)n.l=delNode(n.l,v);else if(v>n.v)n.r=delNode(n.r,v);else{if(!n.l)return n.r;if(!n.r)return n.l;let m=n.r;while(m.l)m=m.l;n.v=m.v;n.r=delNode(n.r,m.v)}return n}
async function act(a){const iv=$('val').value,v=iv===''?rnd():+iv;$('val').value='';
  if(a==='clear'){st=[];q=[];ll=[];bst=null;hl=null;log('ניקוי');draw();return}
  if(T==='stack'){if(a==='push'){st.push(v);log(`push(${v})`)}else if(a==='pop'){if(!st.length)return log('⚠ המחסנית ריקה');hl=st.length-1;draw();await sleep(350);log(`pop() → ${st.pop()}`)}else if(st.length){hl=st.length-1;log(`peek() → ${st.at(-1)}`)}}
  else if(T==='queue'){if(a==='enq'){q.push(v);log(`enqueue(${v})`)}else if(a==='deq'){if(!q.length)return log('⚠ התור ריק');hl=0;draw();await sleep(350);log(`dequeue() → ${q.shift()}`)}else if(q.length){hl=0;log(`peek() → ${q[0]}`)}}
  else if(T==='ll'){if(a==='addH'){ll.unshift(v);log(`הוספה בהתחלה ${v}: צעד אחד`)}else if(a==='addT'){for(let i=0;i<ll.length;i++){hl=i;draw();await sleep(180)}ll.push(v);log(`הוספה בסוף ${v}: ${ll.length} צעדים`)}
    else{const t=iv===''?ll[0]:+iv;let found=-1;for(let i=0;i<ll.length;i++){hl=i;draw();await sleep(220);if(ll[i]===t){found=i;break}}if(found<0)log(`${t} לא נמצא`);else if(a==='del'){ll.splice(found,1);log(`מחיקת ${t} אחרי ${found+1} צעדים`)}else log(`${t} נמצא אחרי ${found+1} צעדים`)}}
  else{if(a==='rand'){for(let i=0;i<7;i++)ins(rnd());log('7 ערכים אקראיים');}else if(a==='sorted'){bst=null;for(let i=1;i<=7;i++)ins(i);log('1..7 בסדר עולה: העץ הפך לשרוך, והחיפוש איטי כמו ברשימה!')}
    else if(a==='ins'){let c=bst,steps=0;while(c){hl=c;draw();await sleep(250);steps++;c=v<c.v?c.l:c.r}ins(v);log(`הוספת ${v}: ${steps} השוואות`)}
    else if(a==='find'||a==='del'){const t=iv===''?(bst&&bst.v):+iv;let c=bst,steps=0;while(c){hl=c;draw();await sleep(300);steps++;if(c.v===t)break;c=t<c.v?c.l:c.r}
      if(!c)log(`${t} לא נמצא (${steps} השוואות)`);else if(a==='del'){bst=delNode(bst,t);log(`מחיקת ${t} (${steps} השוואות)`)}else log(`${t} נמצא אחרי ${steps} השוואות`)}
    else if(a==='inorder'){const o=[];const w=n=>{if(!n)return;w(n.l);o.push(n);w(n.r)};w(bst);for(const n of o){hl=n;draw();await sleep(300)}log('סריקה ממוינת: '+o.map(n=>n.v).join(', '))}
    log(`גובה העץ: ${height(bst)}`)}
  hl=a==='peek'?hl:null;draw()}
$('tabs').onclick=e=>{const t=e.target.dataset.t;if(t)setT(t)};
$('ctl').onclick=e=>{const a=e.target.dataset.a;if(a)act(a)};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='val'){act(CTL[T][0][0])}});
[7,3,9].forEach(x=>st.push(x));[4,8,1].forEach(x=>q.push(x));[5,2,7].forEach(x=>ll.push(x));[50,30,70,20,40,60,80].forEach(ins);
setT('stack');
</script>
</div>
<script src="dl.js" defer></script>
</body>
</html>
