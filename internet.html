<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>איך עובד האינטרנט</title>
<style>
:root{--bg:#0f0c24;--ink:#f3efff;--muted:#a9a3c9;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--acc:#4cc9f0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#3b1d7a 0%,transparent 55%),radial-gradient(circle at 0% 100%,#5a1d4a 0%,transparent 45%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;padding:20px 16px 40px;display:flex;justify-content:center}
.wrap{width:100%;max-width:860px;display:flex;flex-direction:column;gap:16px}
a.back{color:var(--muted);text-decoration:none;font-size:.9rem}
a.back:hover{color:var(--ink)}
h1{margin:0;font-size:clamp(1.8rem,5vw,2.5rem);color:var(--acc)}
h2{margin:0 0 10px;font-size:1.15rem}
p.sub{margin:-8px 0 0;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:.9rem}
label.inline{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
input,select,textarea{font:inherit;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
select option{background:#1d1840}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--acc)}
input[type=color]{padding:2px;height:40px;width:56px}
textarea{resize:vertical}
button{font:inherit;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 15px;font-weight:600;transition:background .15s,transform .1s}
button:hover{background:rgba(255,255,255,.12)}
button:active{transform:scale(.97)}
button.pri,button.on{background:var(--acc);color:#140f2b;border-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center}
.stat small{display:block;color:var(--muted);font-size:.8rem}
.stat b{font-size:1.45rem;color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--muted);font-weight:600}
.num{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:.85rem;margin:0;line-height:1.6}
.tag{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wrap{max-width:1250px!important}
svg{width:100%;height:auto;display:block;background:rgba(0,0,0,.25);border-radius:14px;direction:ltr}
.stp{display:flex;flex-wrap:wrap;gap:6px}
.stp button{font-size:.85rem;padding:6px 10px}
.stp button.done{border-color:#58d68d}
.exp{font-size:1.05rem;line-height:1.8;min-height:5em}
.pkt{font-family:Consolas,monospace;font-size:.82rem;direction:ltr;text-align:left;background:rgba(0,0,0,.3);border-radius:10px;padding:10px;white-space:pre-wrap;min-height:120px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="התחל כאן.html">→ חזרה לקופסת ההפתעות</a>
  <h1>🌐 איך עובד האינטרנט</h1>
<p class="sub">מה קורה בחצי השנייה שבין הקלדת כתובת לבין הופעת האתר: חיפוש בספר הטלפונים של האינטרנט (DNS), לחיצת היד (TCP), ההצפנה (TLS), הבקשה והתשובה (HTTP). כל שלב מוצג כחבילות שעוברות על המסך.</p>
<div class="panel row"><label class="inline">כתובת <input id="url" value="https://www.example.co.il/" style="width:280px;direction:ltr"></label><button class="pri" id="go">▶ הפעלה</button><button id="next">⏭ שלב הבא</button><button id="reset">↺</button><label class="inline">מהירות <input type="range" id="sp" min="1" max="10" value="4" style="width:90px"></label></div>
<div class="panel stp" id="stp"></div>
<div class="panel"><svg id="map" viewBox="0 0 1000 380"></svg></div>
<div class="grid2">
  <div class="panel"><h2 id="st"></h2><div class="exp" id="exp"></div></div>
  <div class="panel"><h2>📦 מה יש בתוך החבילה</h2><div class="pkt" id="pkt"></div></div>
</div>
<div class="stats" id="tm"></div>
<script>
const $=id=>document.getElementById(id);const sleep=ms=>new Promise(r=>setTimeout(r,ms/(+$('sp').value/4)));
const NODES={pc:[80,200,'💻','המחשב שלך'],rt:[250,200,'📶','הראוטר בבית'],isp:[420,200,'🏢','ספקית האינטרנט'],dns:[420,60,'📒','שרת DNS'],root:[640,60,'🌍','שרת שורש / .il'],cdn:[640,320,'⚡','CDN קרוב'],srv:[900,200,'🖥️','שרת האתר']};
let host='www.example.co.il',ip='93.184.216.34',path='/',step=0,running=false,log=[];
const STEPS=[
 {n:'1. DNS',t:'מחפשים את הכתובת',ms:40,route:['pc','rt','isp','dns','root','dns','isp','rt','pc'],c:'#ffd166',exp:h=>`המחשב יודע רק את השם <b>${h}</b>, אבל כדי לשלוח חבילות צריך כתובת IP (כמו מספר טלפון). הוא שואל את שרת ה־DNS, שבודק מול שרתים אחרים ועונה: <b>${ip}</b>. בפעם הבאה התשובה כבר שמורה (cache) ולוקחת 0 מילישניות.`,pkt:h=>`DNS Query\n  Type: A\n  Name: ${h}\n\nDNS Response\n  ${h}  →  ${ip}\n  TTL: 3600 (לשמור שעה)`},
 {n:'2. TCP',t:'לחיצת יד משולשת',ms:30,route:['pc','rt','isp','srv','isp','rt','pc','rt','isp','srv'],c:'#58d68d',exp:()=>`לפני ששולחים מידע, המחשב והשרת "לוחצים ידיים" כדי לוודא ששניהם שומעים: <b>SYN</b> ("שומע?"), <b>SYN-ACK</b> ("שומע, ואתה?"), <b>ACK</b> ("מעולה"). מעכשיו יש חיבור אמין: חבילה שהלכה לאיבוד נשלחת שוב.`,pkt:()=>`→ SYN      seq=1000\n← SYN-ACK  seq=5000 ack=1001\n→ ACK      ack=5001\n\nSrc Port: 52814  →  Dst Port: 443`},
 {n:'3. TLS',t:'הצפנה ומנעול',ms:35,route:['pc','rt','isp','srv','isp','rt','pc'],c:'#c49bff',exp:h=>`בגלל ה־<b>https</b>, מסכימים על מפתח הצפנה סודי. השרת שולח תעודה דיגיטלית שמוכיחה שהוא באמת ${h} (זה המנעול בדפדפן). מעכשיו, גם אם מישהו באמצע מקשיב (למשל ברשת Wi‑Fi ציבורית), הוא רואה רק ג׳יבריש.`,pkt:h=>`ClientHello  (TLS 1.3, cipher suites...)\nServerHello + Certificate\n  Subject: ${h}\n  Issuer:  Let's Encrypt\n  Valid ✔\nKey exchange: X25519\n🔒 Encrypted session established`},
 {n:'4. HTTP',t:'הבקשה',ms:20,route:['pc','rt','isp','srv'],c:'#4cc9f0',exp:()=>`עכשיו הדפדפן שולח את הבקשה עצמה: "תן לי את העמוד". היא כוללת גם מידע על הדפדפן, על השפה המועדפת ועוגיות (cookies).`,pkt:(h,p)=>`GET ${p} HTTP/2\nHost: ${h}\nUser-Agent: Chrome/140\nAccept-Language: he-IL,he\nCookie: session=…`},
 {n:'5. תשובה',t:'השרת עונה',ms:60,route:['srv','isp','rt','pc'],c:'#ff9f68',exp:()=>`השרת מכין את העמוד ושולח אותו חזרה, מפורק להרבה חבילות קטנות (בערך 1,400 בתים כל אחת). כל חבילה יכולה לעבור בדרך אחרת, והמחשב מרכיב אותן מחדש לפי המספור.`,pkt:()=>`HTTP/2 200 OK\nContent-Type: text/html; charset=utf-8\nContent-Length: 48213\nCache-Control: max-age=600\n\n<!DOCTYPE html>\n<html lang="he">…`},
 {n:'6. עוד קבצים',t:'תמונות, עיצוב וסקריפטים',ms:45,route:['pc','rt','isp','cdn','isp','rt','pc'],c:'#ff8fab',exp:()=>`הדפדפן קורא את ה־HTML ומגלה שצריך עוד עשרות קבצים: עיצוב (CSS), קוד (JS), תמונות וגופנים. רובם מגיעים משרת CDN שנמצא קרוב פיזית אליך, ולכן הם מהירים יותר.`,pkt:()=>`GET /style.css      → 200 (CDN, 8 ms)\nGET /app.js         → 200 (CDN, 11 ms)\nGET /logo.svg       → 200 (cache)\nGET /font.woff2     → 200 (CDN, 9 ms)`},
 {n:'7. ציור',t:'הדפדפן מצייר את העמוד',ms:25,route:[],c:'#90e0a0',exp:()=>`הדפדפן בונה עץ של כל האלמנטים (DOM), מחשב איפה כל דבר עומד (layout) ומצייר פיקסלים על המסך. 🎉 כל התהליך לקח בערך חצי שנייה.`,pkt:()=>`DOM:    1,284 nodes\nLayout: 12 ms\nPaint:  6 ms\n\n✅ העמוד מוכן`}];
function base(active=[]){let s='';const E=[['pc','rt'],['rt','isp'],['isp','dns'],['dns','root'],['isp','srv'],['isp','cdn']];
  E.forEach(([a,b])=>{const A=NODES[a],B=NODES[b];s+=`<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="#4a4270" stroke-width="3" stroke-dasharray="6 5"/>`});
  Object.entries(NODES).forEach(([k,[x,y,ic,n]])=>{const on=active.includes(k);s+=`<g><circle cx="${x}" cy="${y}" r="36" fill="${on?'#2e2660':'#1d1840'}" stroke="${on?'#4cc9f0':'#4a4270'}" stroke-width="3"/><text x="${x}" y="${y+10}" text-anchor="middle" font-size="30">${ic}</text><text x="${x}" y="${y+58}" text-anchor="middle" font-size="14" fill="#a9a3c9">${n}</text></g>`});return s}
async function animate(S){const r=S.route;if(!r.length){$('map').innerHTML=base()+`<text x="500" y="200" text-anchor="middle" font-size="60">🖼️✨</text>`;await sleep(900);return}
  for(let i=0;i<r.length-1;i++){const A=NODES[r[i]],B=NODES[r[i+1]];for(let t=0;t<=1;t+=.07){const x=A[0]+(B[0]-A[0])*t,y=A[1]+(B[1]-A[1])*t;$('map').innerHTML=base([r[i],r[i+1]])+`<rect x="${x-16}" y="${y-11}" width="32" height="22" rx="5" fill="${S.c}"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="12" font-weight="800" fill="#140f2b">📦</text>`;await sleep(22)}}}
function ui(){$('stp').innerHTML=STEPS.map((s,i)=>`<button data-i="${i}" class="${i<step?'done':''} ${i===step-1?'on':''}">${s.n}</button>`).join('');
  const S=STEPS[step-1];$('st').textContent=S?`${S.n}: ${S.t}`:'לחצו הפעלה';$('exp').innerHTML=S?S.exp(host,path):'כל אתר שאתם פותחים עובר את 7 השלבים האלה. לחצו ▶ כדי לראות אותם קורים.';$('pkt').textContent=S?S.pkt(host,path):'';
  const done=STEPS.slice(0,step);$('tm').innerHTML=[['שלבים',`${step}/${STEPS.length}`],['זמן מצטבר (משוער)',done.reduce((a,s)=>a+s.ms,0)+' ms'],['חבילות שעברו',done.reduce((a,s)=>a+Math.max(0,s.route.length-1),0)]].map(([a,b])=>`<div class="stat"><small>${a}</small><b>${b}</b></div>`).join('')}
function parse(){try{const u=new URL($('url').value.trim());host=u.hostname;path=u.pathname+u.search;let h=0;for(const c of host)h=(h*31+c.charCodeAt(0))>>>0;ip=`${(h>>>24)%223+1}.${(h>>>16)&255}.${(h>>>8)&255}.${h&255}`}catch{host=$('url').value.trim();path='/'}}
async function next(){if(step>=STEPS.length||running)return;running=true;step++;ui();await animate(STEPS[step-1]);running=false}
$('next').onclick=next;$('go').onclick=async()=>{parse();if(step>=STEPS.length){step=0;ui()}while(step<STEPS.length){await next();await sleep(500)}};
$('reset').onclick=()=>{if(running)return;step=0;parse();$('map').innerHTML=base();ui()};
$('stp').onclick=e=>{const i=e.target.dataset.i;if(i===undefined||running)return;step=+i;parse();next()};
parse();$('map').innerHTML=base();ui();
</script>
</div>
<script src="dl.js" defer></script>
</body>
</html>
