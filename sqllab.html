<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>SQL בתנועה</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#243d63,transparent 50%),#0b0e14;color:#e6edf3;font:16px/1.5 "Segoe UI",Arial,sans-serif;padding:24px 16px}.wrap{max-width:1050px;margin:auto}a{color:#9bd1ff}h1{margin:8px 0;color:#58d68d}p{color:#aab7c8}.panel{background:#121722;border:1px solid #304056;border-radius:15px;padding:18px;margin:15px 0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}button,select,input,textarea{font:inherit;color:#e6edf3;background:#1a2332;border:1px solid #40516a;border-radius:9px;padding:8px 11px}button{cursor:pointer}button:hover{background:#284465}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #58d68d}code,pre{font-family:Consolas,monospace;direction:ltr;text-align:left}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#090d15;padding:15px;border-radius:10px}table{border-collapse:collapse;width:100%;direction:ltr;text-align:left}th,td{border-bottom:1px solid #304056;padding:8px}th{color:#58d68d}.scroll{overflow:auto}.status{color:#ffd166;min-height:1.6em}.hint{color:#9bd1ff}@media(max-width:600px){body{padding:14px 9px}.panel{padding:12px}}textarea{width:100%;min-height:95px;resize:vertical}tr.match{background:#173b33}tr.filtered{opacity:.43}.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}.step{background:#1c2b3d;border-radius:9px;padding:10px}.step b{color:#58d68d}.samples button{margin:4px}.scroll{max-height:420px}</style></head><body><main class="wrap"><a href="התחל כאן.html#dev">← למפתחים</a><h1>🗃️ SQL בתנועה</h1><p>לומדים SELECT, WHERE, ORDER BY, LIMIT ו־JOIN דרך נתונים קטנים. מריצים שאילתה ורואים אילו שורות עברו כל שלב. זו סביבת לימוד מקומית עם תחביר מוגבל, לא מנוע SQL מלא.</p><section class="panel"><h2>נסו שאילתה</h2><div class="samples"><button data-q="SELECT * FROM employees">כל העובדים</button><button data-q="SELECT name, salary FROM employees WHERE salary >= 12000 ORDER BY salary DESC">סינון ומיון</button><button data-q="SELECT name, department FROM employees WHERE department = 'פיתוח'">תנאי טקסט</button><button data-q="SELECT employees.name, departments.manager FROM employees JOIN departments ON employees.department = departments.name">חיבור טבלאות</button><button data-q="SELECT name FROM employees ORDER BY salary DESC LIMIT 2">שניים ראשונים</button></div><form id="form"><textarea id="query" dir="ltr" spellcheck="false" aria-label="שאילתת SQL">SELECT name, salary FROM employees WHERE salary >= 12000 ORDER BY salary DESC</textarea><div class="row"><button>▶ הרצה</button><span id="status" class="status" role="status"></span></div></form></section><section class="panel"><h2>טבלאות המקור</h2><div id="sources" class="row"></div></section><section class="panel"><h2>מה קרה לשורות?</h2><div id="steps" class="steps"></div><h2>התוצאה</h2><div id="result" class="scroll"></div></section></main><script>
const employees=[{id:1,name:'נועה',department:'פיתוח',salary:16000},{id:2,name:'דניאל',department:'עיצוב',salary:11500},{id:3,name:'אורי',department:'פיתוח',salary:13000},{id:4,name:'תמר',department:'שירות',salary:9500},{id:5,name:'יעל',department:'עיצוב',salary:12500}];const departments=[{name:'פיתוח',manager:'רון'},{name:'עיצוב',manager:'מיכל'},{name:'שירות',manager:'שחר'}];const $=id=>document.getElementById(id);function table(rows,columns){const t=document.createElement('table'),head=document.createElement('tr');for(const c of columns){const th=document.createElement('th');th.textContent=c;head.append(th)}t.append(head);for(const row of rows){const tr=document.createElement('tr');for(const c of columns){const td=document.createElement('td');td.textContent=row[c]??'';tr.append(td)}t.append(tr)}return t}function source(title,rows){const d=document.createElement('div');d.className='scroll';d.style.flex='1 1 310px';const h=document.createElement('h3');h.textContent=title;d.append(h,table(rows,Object.keys(rows[0])));return d}$('sources').append(source('employees',employees),source('departments',departments));function step(title,detail){const d=document.createElement('div');d.className='step';const b=document.createElement('b');b.textContent=title;d.append(b,document.createElement('br'),document.createTextNode(detail));$('steps').append(d)}function execute(sql){$('steps').replaceChildren();$('result').replaceChildren();const query=sql.trim().replace(/;$/,'').trim();const re=/^SELECT\s+(.+?)\s+FROM\s+(employees|departments)(?:\s+JOIN\s+(departments|employees)\s+ON\s+([\w.]+)\s*=\s*([\w.]+))?(?:\s+WHERE\s+([\w.]+)\s*(>=|<=|!=|=|>|<)\s*('(?:[^']|'')*'|-?\d+(?:\.\d+)?))?(?:\s+ORDER\s+BY\s+([\w.]+)(?:\s+(ASC|DESC))?)?(?:\s+LIMIT\s+(\d+))?$/i;const m=query.match(re);if(!m)throw Error('תחביר לא נתמך. נסו אחת מדוגמאות ה־SELECT למעלה.');const [,sel,base,join,left,right,wcol,op,value,sort,dir,limit]=m;const data={employees,departments},keys=base==='employees'?['id','name','department','salary']:['name','manager'];let rows=data[base].map(r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[base+'.'+k,v])));step('FROM',rows.length+' שורות מ־'+base);if(join){if(join===base)throw Error('בחרו טבלת JOIN שונה.');const allowed=Object.keys(rows[0]);const other=Object.keys(data[join][0]).map(k=>join+'.'+k);if(!allowed.includes(left)||!other.includes(right))throw Error('עמודות JOIN חייבות להגיע מהטבלאות הנכונות.');rows=rows.flatMap(r=>data[join].filter(s=>r[left]===s[right.split('.')[1]]).map(s=>({...r,...Object.fromEntries(Object.entries(s).map(([k,v])=>[join+'.'+k,v]))})));step('JOIN',rows.length+' שורות אחרי התאמת '+left+' = '+right)}const available=[...keys.map(k=>base+'.'+k),...(join?Object.keys(data[join][0]).map(k=>join+'.'+k):[])];function resolve(c){if(available.includes(c))return c;const hits=available.filter(k=>k.endsWith('.'+c));if(hits.length===1)return hits[0];throw Error('עמודה לא קיימת או עמומה: '+c)}if(wcol){const col=resolve(wcol),literal=value.startsWith("'")?value.slice(1,-1).replace(/''/g,"'"):Number(value);rows=rows.filter(r=>{const a=r[col];if(typeof a!==typeof literal)throw Error('סוג הערך בתנאי אינו מתאים לעמודה');switch(op){case '=':return a===literal;case '!=':return a!==literal;case '>':return a>literal;case '<':return a<literal;case '>=':return a>=literal;case '<=':return a<=literal}});step('WHERE',rows.length+' שורות עומדות בתנאי '+wcol+' '+op+' '+value)}if(sort){const col=resolve(sort);rows.sort((a,b)=>typeof a[col]==='number'?a[col]-b[col]:String(a[col]).localeCompare(String(b[col]),'he'));if(dir?.toUpperCase()==='DESC')rows.reverse();step('ORDER BY','מיון לפי '+sort+' '+(dir||'ASC'))}if(limit){rows=rows.slice(0,Number(limit));step('LIMIT','נשארו עד '+limit+' שורות')}const cols=sel.trim()==='*'?available:sel.split(',').map(x=>x.trim()).map(resolve);if(!cols.length||cols.some(c=>!c))throw Error('בחרו עמודות לתצוגה');const output=rows.map(r=>Object.fromEntries(cols.map(c=>[c,r[c]])));step('SELECT',cols.length+' עמודות בתוצאה');$('result').append(table(output,cols));$('status').textContent=output.length+' שורות בתוצאה'}$('form').onsubmit=e=>{e.preventDefault();try{execute($('query').value)}catch(err){$('status').textContent='⚠️ '+err.message;$('steps').replaceChildren();$('result').replaceChildren()}};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('query').value=b.dataset.q;$('form').requestSubmit()});$('form').requestSubmit();
</script><script src="dl.js" defer></script></body></html>
