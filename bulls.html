<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בול פגיעה</title>
<style>
:root{--bg:#0f0c24;--ink:#f3efff;--muted:#a9a3c9;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--acc:#ffb703}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#3b1d7a 0%,transparent 55%),radial-gradient(circle at 0% 100%,#5a1d4a 0%,transparent 45%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;padding:20px 16px 40px;display:flex;justify-content:center}
.wrap{width:100%;max-width:860px;display:flex;flex-direction:column;gap:16px}
a.back{color:var(--muted);text-decoration:none;font-size:.9rem}
a.back:hover{color:var(--ink)}
h1{margin:0;font-size:clamp(1.8rem,5vw,2.5rem);color:var(--acc)}
h2{margin:0 0 10px;font-size:1.15rem}
p.sub{margin:-8px 0 0;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:.9rem}
label.inline{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
input,select,textarea{font:inherit;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
select option{background:#1d1840}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--acc)}
input[type=color]{padding:2px;height:40px;width:56px}
textarea{resize:vertical}
button{font:inherit;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 15px;font-weight:600;transition:background .15s,transform .1s}
button:hover{background:rgba(255,255,255,.12)}
button:active{transform:scale(.97)}
button.pri,button.on{background:var(--acc);color:#140f2b;border-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center}
.stat small{display:block;color:var(--muted);font-size:.8rem}
.stat b{font-size:1.45rem;color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--muted);font-weight:600}
.num{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:.85rem;margin:0;line-height:1.6}
.tag{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wrap{max-width:560px!important}
.in{display:flex;gap:8px;justify-content:center;direction:ltr}
.in input{width:60px;height:70px;font-size:2rem;text-align:center;font-weight:800}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:340px;margin:10px auto 0;direction:ltr}
.pad button{font-size:1.3rem;padding:10px 0}
.pad button.used{opacity:.3}
.pad button.cross{text-decoration:line-through;opacity:.35}
table td{font-size:1.1rem}
.g{direction:ltr;font-family:Consolas,monospace;font-size:1.4rem;letter-spacing:6px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="התחל כאן.html">→ חזרה לקופסת ההפתעות</a>
  <h1>🎯 בול פגיעה</h1>
<p class="sub">המחשב חשב על מספר בן 4 ספרות שונות. מנחשים: <b>בול</b> זו ספרה נכונה במקום הנכון, <b>פגיעה</b> זו ספרה נכונה במקום אחר. כמה ניחושים תצטרכו?</p>
<div class="panel row" style="justify-content:center"><label class="inline">ספרות <select id="len"><option>3</option><option selected>4</option><option>5</option></select></label><label class="inline"><input type="checkbox" id="zero" checked> כולל 0</label><button class="pri" id="new">משחק חדש</button><span class="muted" id="best"></span></div>
<div class="panel">
  <div class="in" id="in"></div>
  <div class="pad" id="pad"></div>
  <div class="row" style="justify-content:center;margin-top:10px"><button id="del">⌫</button><button class="pri" id="go">ניחוש ↵</button><button id="give">🏳️ לגלות</button></div>
  <p class="muted" style="text-align:center;margin:8px 0 0;font-size:.85rem">טיפ: לחיצה ארוכה על ספרה במקלדת מסמנת אותה כ"לא במספר"</p>
</div>
<div class="panel" id="msg" style="text-align:center;font-size:1.25rem;font-weight:800;display:none"></div>
<div class="panel"><table><thead><tr><th>#</th><th>ניחוש</th><th class="num">🎯 בול</th><th class="num">💥 פגיעה</th></tr></thead><tbody id="h"></tbody></table></div>
<script>
const $=id=>document.getElementById(id);let L,sec,hist,cur,over,cross=new Set();
function gen(){const d=[...'0123456789'].filter(x=>$('zero').checked||x!=='0');const s=[];while(s.length<L){const x=d.splice(Math.random()*d.length|0,1)[0];if(!s.length&&x==='0'&&$('zero').checked&&false)continue;s.push(x)}return s.join('')}
function reset(){L=+$('len').value;sec=gen();hist=[];cur='';over=false;cross=new Set();$('msg').style.display='none';draw();best()}
function draw(){$('in').innerHTML=[...Array(L)].map((_,i)=>`<input readonly value="${cur[i]||''}">`).join('');
  $('pad').innerHTML=[...'1234567890'].map(d=>`<button data-d="${d}" class="${cur.includes(d)?'used':''} ${cross.has(d)?'cross':''}" ${d==='0'&&!$('zero').checked?'disabled':''}>${d}</button>`).join('');
  $('h').innerHTML=hist.map((g,i)=>`<tr><td>${i+1}</td><td class="g">${g.g}</td><td class="num">${'🎯'.repeat(g.b)||'—'}</td><td class="num">${'💥'.repeat(g.p)||'—'}</td></tr>`).reverse().join('')}
function add(d){if(over||cur.length>=L||cur.includes(d))return;cur+=d;draw()}
function guess(){if(over)return;if(cur.length<L){flash('צריך '+L+' ספרות');return}let b=0,p=0;[...cur].forEach((c,i)=>{if(sec[i]===c)b++;else if(sec.includes(c))p++});hist.push({g:cur,b,p});cur='';draw();
  if(b===L){over=true;show(`🎉 מצאת את ${sec} ב־${hist.length} ניחושים!`);try{const k='bulls-'+L,o=+localStorage.getItem(k)||0;if(!o||hist.length<o)localStorage.setItem(k,hist.length)}catch{}best()}}
function flash(t){show(t);setTimeout(()=>{if(!over)$('msg').style.display='none'},1400)}
function show(t){$('msg').textContent=t;$('msg').style.display='block'}
function best(){try{const b=localStorage.getItem('bulls-'+L);$('best').textContent=b?`שיא ל־${L} ספרות: ${b} ניחושים`:''}catch{}}
let press;$('pad').addEventListener('pointerdown',e=>{const d=e.target.dataset.d;if(!d)return;press=setTimeout(()=>{press=null;cross.has(d)?cross.delete(d):cross.add(d);draw()},450)});
$('pad').addEventListener('pointerup',e=>{const d=e.target.dataset.d;if(d&&press){clearTimeout(press);press=null;add(d)}});
$('del').onclick=()=>{cur=cur.slice(0,-1);draw()};$('go').onclick=guess;$('give').onclick=()=>{if(!over){over=true;show('המספר היה '+sec)}};
$('new').onclick=reset;$('len').onchange=reset;$('zero').onchange=reset;
addEventListener('keydown',e=>{if(/^\d$/.test(e.key))add(e.key);else if(e.key==='Backspace'){cur=cur.slice(0,-1);draw()}else if(e.key==='Enter')guess()});
reset();
</script>
</div>
<script src="dl.js" defer></script>
</body>
</html>
