<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>רשימת אריזה</title>
<style>
:root{--bg:#0f0c24;--ink:#f3efff;--muted:#a9a3c9;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--acc:#4cc9f0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#3b1d7a 0%,transparent 55%),radial-gradient(circle at 0% 100%,#5a1d4a 0%,transparent 45%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;padding:20px 16px 40px;display:flex;justify-content:center}
.wrap{width:100%;max-width:860px;display:flex;flex-direction:column;gap:16px}
a.back{color:var(--muted);text-decoration:none;font-size:.9rem}
a.back:hover{color:var(--ink)}
h1{margin:0;font-size:clamp(1.8rem,5vw,2.5rem);color:var(--acc)}
h2{margin:0 0 10px;font-size:1.15rem}
p.sub{margin:-8px 0 0;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:.9rem}
label.inline{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
input,select,textarea{font:inherit;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
select option{background:#1d1840}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--acc)}
input[type=color]{padding:2px;height:40px;width:56px}
textarea{resize:vertical}
button{font:inherit;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 15px;font-weight:600;transition:background .15s,transform .1s}
button:hover{background:rgba(255,255,255,.12)}
button:active{transform:scale(.97)}
button.pri,button.on{background:var(--acc);color:#140f2b;border-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center}
.stat small{display:block;color:var(--muted);font-size:.8rem}
.stat b{font-size:1.45rem;color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--muted);font-weight:600}
.num{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:.85rem;margin:0;line-height:1.6}
.tag{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.cat h3{margin:12px 0 6px;color:var(--muted);font-size:.95rem}
.it{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.04);margin-bottom:4px;cursor:pointer;user-select:none}
.it .ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--acc);flex:none;display:flex;align-items:center;justify-content:center;color:#140f2b;font-weight:800}
.it.done{opacity:.45}.it.done .nm{text-decoration:line-through}.it.done .ck{background:var(--acc)}
.it .nm{flex:1}.it .q{color:var(--acc);font-weight:700}
.prog{height:10px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}.prog div{height:100%;background:var(--acc);transition:width .3s}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="התחל כאן.html">→ חזרה לקופסת ההפתעות</a>
  <h1>🧳 רשימת אריזה חכמה</h1>
<p class="sub">בוחרים סוג טיול, מספר ימים ומי נוסע, ומקבלים רשימת אריזה מוכנה עם כמויות. מסמנים מה כבר בתיק, מוסיפים פריטים ושולחים לבני המשפחה.</p>
<div class="panel row">
  <label>סוג<select id="type"><option value="abroad">✈️ חו״ל</option><option value="beach">🏖️ ים / נופש</option><option value="north">🌲 צפון / צימר</option><option value="camp">⛺ קמפינג</option><option value="biz">💼 נסיעת עבודה</option><option value="shabbat">🕯️ שבת אצל המשפחה</option><option value="ski">⛷️ סקי</option></select></label>
  <label>ימים<input id="days" type="number" value="5" min="1" style="width:80px"></label>
  <label>מבוגרים<input id="ad" type="number" value="2" min="0" style="width:70px"></label>
  <label>ילדים<input id="kids" type="number" value="2" min="0" style="width:70px"></label>
  <label class="inline" style="align-self:end"><input type="checkbox" id="baby"> יש תינוק</label>
  <button class="pri" id="gen" style="align-self:end">✨ יצירת רשימה</button>
</div>
<div class="panel">
  <div class="row" style="justify-content:space-between"><b id="cnt"></b><div class="row"><button id="share">📤 וואטסאפ</button><button id="reset">↺ לסמן הכל מחדש</button></div></div>
  <div class="prog" style="margin:8px 0"><div id="bar"></div></div>
  <div id="list"></div>
  <form class="row" id="f" style="margin-top:10px"><input id="nm" placeholder="+ פריט נוסף" style="flex:1" required><button>הוספה</button></form>
</div>
<script>
const $=id=>document.getElementById(id);
// [category, item, qty rule] qty rule: 'd' per day per person, 'p' per person, 'k' per kid, 'b' baby, number fixed
const BASE=[['👕 בגדים','חולצות','dP'],['👕 בגדים','תחתונים','dP'],['👕 בגדים','גרביים','dP'],['👕 בגדים','מכנסיים','hP'],['👕 בגדים','פיג׳מה','p'],['👕 בגדים','נעליים נוחות','p'],['🧴 רחצה','מברשות שיניים','p'],['🧴 רחצה','משחת שיניים',1],['🧴 רחצה','שמפו וסבון',1],['🧴 רחצה','דאודורנט',1],['🧴 רחצה','מגבות','p'],['💊 בריאות','תרופות קבועות',1],['💊 בריאות','אקמול / נורופן',1],['💊 בריאות','פלסטרים',1],['🔌 אלקטרוניקה','מטענים לטלפון','p'],['🔌 אלקטרוניקה','מטען נייד (פאוורבנק)',1],['🎒 שונות','שקיות לכביסה מלוכלכת',2],['🎒 שונות','בקבוקי מים','p']];
const EXTRA={abroad:[['📄 מסמכים','דרכונים','p'],['📄 מסמכים','כרטיסי טיסה / אישורי הזמנה',1],['📄 מסמכים','ביטוח נסיעות',1],['📄 מסמכים','כרטיס אשראי ומזומן במטבע מקומי',1],['🔌 אלקטרוניקה','מתאם שקע',2],['🎒 שונות','מנעול למזוודה',2],['🎒 שונות','כרית צוואר לטיסה','p']],
 beach:[['🏖️ ים','בגדי ים','2P'],['🏖️ ים','קרם הגנה',2],['🏖️ ים','כובעים','p'],['🏖️ ים','משקפי שמש','p'],['🏖️ ים','כפכפים','p'],['🏖️ ים','מגבות חוף','p'],['🏖️ ים','צעצועי חול','k']],
 north:[['🌲 טבע','מעיל / סווטשירט','p'],['🌲 טבע','נעלי הליכה','p'],['🌲 טבע','דוחה יתושים',1],['🌲 טבע','פנס',1],['🍳 אוכל','חטיפים לדרך',1],['🎲 בידור','משחק קופסה',1]],
 camp:[['⛺ ציוד','אוהל',1],['⛺ ציוד','שקי שינה','p'],['⛺ ציוד','מזרנים','p'],['⛺ ציוד','פנסי ראש','p'],['⛺ ציוד','גזייה ובלון',1],['⛺ ציוד','סכו״ם וצלחות','p'],['⛺ ציוד','צידנית',1],['⛺ ציוד','מים (5 ליטר לאדם ליום)','dP'],['⛺ ציוד','שקיות זבל',3],['⛺ ציוד','סכין רב שימושית',1]],
 biz:[['💼 עבודה','לפטופ ומטען',1],['💼 עבודה','כרטיסי ביקור',1],['💼 עבודה','חליפה / בגדים מכובדים','h'],['💼 עבודה','מחברת ועט',1],['💼 עבודה','מסמכים להצגה',1]],
 shabbat:[['🕯️ שבת','בגדי שבת','p'],['🕯️ שבת','נרות שבת',1],['🕯️ שבת','סידורים','p'],['🕯️ שבת','מתנה למארחים',1],['🕯️ שבת','טלית',1],['🕯️ שבת','עוגה / יין',1],['🕯️ שבת','מפתח / נייר טואלט חתוך',1]],
 ski:[['⛷️ שלג','מעילי סקי','p'],['⛷️ שלג','מכנסי סקי','p'],['⛷️ שלג','כפפות','2P'],['⛷️ שלג','כובע גרב','p'],['⛷️ שלג','בגדים תרמיים','hP'],['⛷️ שלג','משקפי סקי','p'],['⛷️ שלג','ליפסטיק / קרם לחות',1]]};
const BABY=[['👶 תינוק','חיתולים',null],['👶 תינוק','מגבונים',3],['👶 תינוק','בקבוקים ומטרנה',1],['👶 תינוק','עגלה',1],['👶 תינוק','בגדי החלפה לתינוק','d2'],['👶 תינוק','מוצץ',2],['👶 תינוק','משחה לתחת',1]];
let S;try{S=JSON.parse(localStorage.getItem('packing'))}catch{}
const save=()=>{try{localStorage.setItem('packing',JSON.stringify(S))}catch{}};
function qty(r,d,P,K){if(typeof r==='number')return r;if(r===null)return d*7;const m={dP:Math.min(d+1,8)*P,hP:Math.ceil(d/2)*P,'2P':2*P,p:P,k:K,h:Math.ceil(d/2),d2:d*2}[r];return m??1}
function gen(){const d=+$('days').value||1,P=(+$('ad').value||0)+(+$('kids').value||0),K=+$('kids').value||0,t=$('type').value;
  const src=[...(t==='shabbat'?BASE.filter(x=>!/מכנסיים|מטען נייד/.test(x[1])):BASE),...(EXTRA[t]||[]),...($('baby').checked?BABY:[])];
  S={items:src.map(([c,n,r])=>({c,n,q:qty(r,d,Math.max(P,1),K),d:false})).filter(x=>x.q>0),t:$('type').selectedOptions[0].text};render()}
function render(){if(!S)return gen();const cats=[...new Set(S.items.map(x=>x.c))];
  $('list').innerHTML=cats.map(c=>`<div class="cat"><h3>${c}</h3>${S.items.map((x,i)=>[x,i]).filter(([x])=>x.c===c).map(([x,i])=>`<div class="it ${x.d?'done':''}" data-i="${i}"><span class="ck">${x.d?'✓':''}</span><span class="nm">${x.n.replace(/</g,'&lt;')}</span>${x.q>1?`<span class="q">×${x.q}</span>`:''}<button data-x="${i}" style="padding:0 6px;font-size:.8rem">✕</button></div>`).join('')}</div>`).join('');
  const d=S.items.filter(x=>x.d).length;$('cnt').textContent=d===S.items.length?'🎉 הכל ארוז! נסיעה טובה':`${d} מתוך ${S.items.length} בתיק`;$('bar').style.width=S.items.length?d/S.items.length*100+'%':'0';save()}
$('list').onclick=e=>{const x=e.target.dataset.x;if(x!==undefined){S.items.splice(+x,1);render();return}const it=e.target.closest('.it');if(it){S.items[it.dataset.i].d=!S.items[it.dataset.i].d;render()}};
$('gen').onclick=()=>{if(S&&S.items.some(x=>x.d)&&!confirm('ליצור רשימה חדשה? הסימונים הנוכחיים יימחקו.'))return;gen()};
$('f').onsubmit=e=>{e.preventDefault();S.items.push({c:'➕ נוספו ידנית',n:$('nm').value,q:1,d:false});$('nm').value='';render()};
$('reset').onclick=()=>{S.items.forEach(x=>x.d=false);render()};
$('share').onclick=()=>{const t=`🧳 רשימת אריזה – ${S.t}\n`+[...new Set(S.items.map(x=>x.c))].map(c=>'\n'+c+'\n'+S.items.filter(x=>x.c===c).map(x=>`${x.d?'✅':'⬜'} ${x.n}${x.q>1?' ×'+x.q:''}`).join('\n')).join('\n');open('https://wa.me/?text='+encodeURIComponent(t),'_blank')};
render();
</script>
</div>
</body>
</html>
