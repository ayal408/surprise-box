<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מחולל ברקודים</title><link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js" defer></script>
<style>
:root{color-scheme:dark;--bg:#0e1523;--panel:#17253a;--line:#34445b;--ink:#f3f7ff;--muted:#a8b8ca;--acc:#79d9be}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#23496b,transparent 42%),var(--bg);color:var(--ink);font:16px system-ui,Arial,sans-serif}main{max-width:1000px;margin:auto;padding:20px 16px 60px}a{color:var(--acc)}h1{font-size:clamp(1.7rem,5vw,2.4rem);margin:12px 0}h2{margin-top:0;font-size:1.25rem}.hint{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}label{display:block;margin:12px 0 5px}input,select,button{font:inherit}input:not([type=file]),select{width:100%;padding:10px;border-radius:9px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}button,.btn{border:1px solid var(--acc);background:var(--acc);color:#092620;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}button:disabled{opacity:.55;cursor:default}.secondary{background:transparent;color:var(--ink);border-color:var(--line)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.preview{overflow:auto;background:#fff;border-radius:12px;margin-top:14px;padding:20px;text-align:center;min-height:120px}.preview svg{max-width:100%;height:auto}video{width:100%;max-height:280px;background:#050a12;border-radius:12px;margin-top:12px}#result{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);padding:12px;border-radius:10px;min-height:54px;direction:auto}#status,#genstatus{min-height:25px;color:var(--muted)}.file{max-width:100%}
</style></head><body><main><a href="התחל כאן.html">→ חזרה לקופסת ההפתעות</a><h1>▥ מחולל ברקודים</h1><p class="hint">יצירת ברקודים להדפסה בקובצי PNG או SVG. לסריקה עברו לכלי הסורק.</p><div class="grid">
<section class="panel"><h2>מחולל ברקודים</h2><label for="value">טקסט או מספר</label><input id="value" value="123456789012" autocomplete="off" spellcheck="false"><label for="format">סוג ברקוד</label><select id="format"><option value="CODE128">Code 128 — טקסט ומספרים</option><option value="EAN13">EAN-13 — 12 או 13 ספרות</option><option value="EAN8">EAN-8 — 7 או 8 ספרות</option><option value="UPC">UPC-A — 11 או 12 ספרות</option><option value="CODE39">Code 39</option><option value="ITF14">ITF-14 — 13 או 14 ספרות</option></select><div class="preview"><svg id="barcode" role="img" aria-label="תצוגה מקדימה של הברקוד"></svg></div><p id="genstatus" role="status"></p><div class="actions"><button id="png" type="button">הורדת PNG</button><button id="svg" type="button" class="secondary">הורדת SVG</button><a class="btn secondary" href="qr.html">יצירת QR</a><a class="btn secondary" href="scanner.html">סריקת קוד</a></div></section>
</div></main><script src="dl.js" defer></script>
<script>
(()=>{const $=id=>document.getElementById(id);
const genSay=s=>{$('genstatus').textContent=s};
function generate(){const value=$('value').value.trim(),format=$('format').value;try{if(!window.JsBarcode)throw Error('הספרייה עדיין נטענת או שהרשת חסומה.');if(!value)throw Error('הקלידו ערך לברקוד.');JsBarcode('#barcode',value,{format,lineColor:'#101820',background:'#ffffff',width:2,height:100,margin:12,displayValue:true,fontSize:18});$('png').disabled=$('svg').disabled=false;genSay('הברקוד מוכן. בסוגי EAN/UPC ספרת ביקורת מתווספת לפי הצורך.')}catch(e){$('barcode').replaceChildren();$('png').disabled=$('svg').disabled=true;genSay(e.message||'הערך אינו מתאים לסוג הברקוד.')}}
function save(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('svg').onclick=()=>save(new Blob([new XMLSerializer().serializeToString($('barcode'))],{type:'image/svg+xml;charset=utf-8'}),'barcode.svg');
$('png').onclick=()=>{const xml=new XMLSerializer().serializeToString($('barcode')),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml'})),im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.naturalWidth*2;c.height=im.naturalHeight*2;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{if(b)save(b,'barcode.png');URL.revokeObjectURL(url)},'image/png')};im.onerror=()=>{genSay('לא ניתן ליצור PNG. נסו SVG.');URL.revokeObjectURL(url)};im.src=url};
$('value').addEventListener('input',generate);$('format').addEventListener('change',generate);window.addEventListener('load',generate);

})();
</script></body></html>
