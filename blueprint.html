<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שרטוט הדירה</title>
<style>
:root{--bp:#0b3d91;--ln:rgba(255,255,255,.85);--grid:rgba(255,255,255,.12);--ink:#e8f1ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bp);color:var(--ink);font-family:"Courier New",Consolas,monospace;padding:18px 14px}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 290px;gap:16px}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:end;border:2px solid var(--ln);padding:10px 14px;flex-wrap:wrap;gap:8px}
header h1{margin:0;font-size:1.6rem;letter-spacing:3px;text-transform:uppercase}
header a{color:var(--ink)}
.stage{border:2px solid var(--ln);position:relative;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;min-height:520px;touch-action:none}
canvas{display:block;width:100%;height:100%;position:absolute;inset:0;cursor:crosshair}
.panel{border:2px solid var(--ln);padding:12px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-size:1rem;letter-spacing:2px;border-bottom:1px dashed var(--ln);padding-bottom:6px}
label{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.9rem}
input,select{font:inherit;background:transparent;color:var(--ink);border:1px solid var(--ln);padding:4px 6px;width:120px}
select option{background:var(--bp)}
button{font:inherit;background:transparent;color:var(--ink);border:1px solid var(--ln);padding:6px 10px;cursor:pointer;letter-spacing:1px}
button:hover,button.on{background:var(--ink);color:var(--bp)}
.row{display:flex;gap:6px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:.85rem}
td,th{border-bottom:1px dashed rgba(255,255,255,.35);padding:4px 2px;text-align:right}
td.x{cursor:pointer;opacity:.7}
.total{font-size:1.2rem;border-top:2px solid var(--ln);padding-top:8px;display:flex;justify-content:space-between}
.stamp{font-size:.72rem;opacity:.7;line-height:1.5}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.stage{min-height:420px}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>▭ שרטוט הדירה</h1><span>גוררים מלבן על הרשת כדי להוסיף חדר · <a href="התחל כאן.html">חזרה לקופסה</a></span></header>
  <div class="stage" id="stage"><canvas id="cv"></canvas></div>
  <div class="panel">
    <h2>חדר חדש</h2>
    <label>שם <input id="rname" value="סלון"></label>
    <label>סוג <select id="rtype"><option value="1">מקורה (100%)</option><option value="0.5">מרפסת (50%)</option><option value="0.25">מחסן/חניה (25%)</option></select></label>
    <label>קנה מידה <select id="scale"><option value="0.5">משבצת = 0.5 מ׳</option><option value="0.25">משבצת = 0.25 מ׳</option><option value="1">משבצת = 1 מ׳</option></select></label>
    <div class="row"><button id="undo">↶ ביטול</button><button id="clear">נקה הכל</button><button id="png">💾 שמור תמונה</button></div>
    <h2>טבלת שטחים</h2>
    <table><thead><tr><th>חדר</th><th>מידות</th><th>מ״ר</th><th></th></tr></thead><tbody id="list"></tbody></table>
    <div class="total"><span>שטח משוקלל</span><b id="tot">0</b></div>
    <label>מחיר למ״ר (₪) <input id="ppm" type="number" value="25000"></label>
    <div class="total"><span>שווי משוער</span><b id="val">0</b></div>
    <p class="stamp">משקלות לפי מקובל בשמאות: מרפסת 50%, מחסן/חניה 25%. להערכה בלבד.<br>DRAWN BY: קופסת ההפתעות · REV A</p>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),x=cv.getContext('2d'),st=document.getElementById('stage');
const $=id=>document.getElementById(id);
const G=20;let rooms=[],drag=null;
try{rooms=JSON.parse(localStorage.getItem('bp-rooms'))||[]}catch{}
if(!rooms.length)rooms=[{n:'סלון',t:1,x:2,y:2,w:12,h:9},{n:'מטבח',t:1,x:14,y:2,w:7,h:6},{n:'חדר שינה',t:1,x:14,y:8,w:7,h:8},{n:'מרפסת',t:.5,x:2,y:11,w:12,h:5}];
const S=()=>+$('scale').value;
function size(){const r=st.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;x.setTransform(d,0,0,d,0,0);draw()}
function cell(e){const r=cv.getBoundingClientRect();return{x:Math.round((e.clientX-r.left)/G),y:Math.round((e.clientY-r.top)/G)}}
function norm(a,b){return{x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(a.x-b.x),h:Math.abs(a.y-b.y)}}
const m2=r=>r.w*S()*r.h*S();
function draw(){const W=cv.width/(devicePixelRatio||1),H=cv.height/(devicePixelRatio||1);x.clearRect(0,0,W,H);
  const all=drag&&drag.b?[...rooms,{...norm(drag.a,drag.b),n:$('rname').value,t:+$('rtype').value,tmp:1}]:rooms;
  all.forEach(r=>{const X=r.x*G,Y=r.y*G,w=r.w*G,h=r.h*G;x.strokeStyle='#fff';x.lineWidth=r.t<1?1.5:3;x.setLineDash(r.t<1?[8,5]:r.tmp?[4,4]:[]);x.strokeRect(X,Y,w,h);x.setLineDash([]);
    if(r.t<1){x.save();x.beginPath();x.rect(X,Y,w,h);x.clip();x.strokeStyle='rgba(255,255,255,.18)';x.lineWidth=1;for(let k=-h;k<w;k+=12){x.beginPath();x.moveTo(X+k,Y+h);x.lineTo(X+k+h,Y);x.stroke()}x.restore()}
    x.fillStyle='#fff';x.textAlign='center';x.font='bold 14px Courier New';x.fillText(r.n,X+w/2,Y+h/2-4);x.font='12px Courier New';x.fillText(`${(r.w*S()).toFixed(2)}×${(r.h*S()).toFixed(2)} · ${m2(r).toFixed(1)}מ״ר`,X+w/2,Y+h/2+14);
    // dimension line
    x.strokeStyle='rgba(255,255,255,.6)';x.lineWidth=1;x.beginPath();x.moveTo(X,Y-6);x.lineTo(X+w,Y-6);x.moveTo(X,Y-10);x.lineTo(X,Y-2);x.moveTo(X+w,Y-10);x.lineTo(X+w,Y-2);x.stroke()});
  // north arrow
  const W0=W-40;x.strokeStyle='#fff';x.fillStyle='#fff';x.beginPath();x.moveTo(W0,20);x.lineTo(W0-8,44);x.lineTo(W0,38);x.closePath();x.fill();x.font='bold 13px Courier New';x.fillText('N',W0,60);
  list()}
function list(){let tot=0;$('list').innerHTML=rooms.map((r,i)=>{const a=m2(r);tot+=a*r.t;return`<tr><td>${r.n}${r.t<1?` <small>(${r.t*100}%)</small>`:''}</td><td>${(r.w*S()).toFixed(1)}×${(r.h*S()).toFixed(1)}</td><td>${a.toFixed(1)}</td><td class="x" data-i="${i}">✕</td></tr>`}).join('');
  $('tot').textContent=tot.toFixed(1)+' מ״ר';$('val').textContent='₪'+Math.round(tot*(+$('ppm').value||0)).toLocaleString('he-IL');localStorage.setItem('bp-rooms',JSON.stringify(rooms))}
cv.addEventListener('pointerdown',e=>{drag={a:cell(e)};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(drag){drag.b=cell(e);draw()}});
cv.addEventListener('pointerup',()=>{if(drag&&drag.b){const r=norm(drag.a,drag.b);if(r.w&&r.h){rooms.push({...r,n:$('rname').value||'חדר',t:+$('rtype').value});const nm=['חדר שינה','חדר רחצה','פינת עבודה','שירותים','מסדרון','חדר ילדים'];$('rname').value=nm[rooms.length%nm.length]}}drag=null;draw()});
$('list').addEventListener('click',e=>{const i=e.target.dataset.i;if(i!==undefined){rooms.splice(+i,1);draw()}});
$('undo').onclick=()=>{rooms.pop();draw()};
$('clear').onclick=()=>{rooms=[];draw()};
$('scale').onchange=draw;$('ppm').oninput=list;
$('png').onclick=()=>{const c2=document.createElement('canvas');c2.width=cv.width;c2.height=cv.height;const y=c2.getContext('2d');y.fillStyle='#0b3d91';y.fillRect(0,0,c2.width,c2.height);y.drawImage(cv,0,0);const a=document.createElement('a');a.download='שרטוט.png';a.href=c2.toDataURL();a.click()};
addEventListener('resize',size);size();
</script>
</body>
</html>
