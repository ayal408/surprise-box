<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מחולל מבוכים</title><link rel="icon" href="icon.svg" type="image/svg+xml"><style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:radial-gradient(circle at 80% 0%,#422078,transparent 55%),#0f0c24;color:#f3efff;font:16px 'Segoe UI',Arial,sans-serif}.wrap{max-width:850px;margin:auto}a,p{color:#bdb5df}h1{color:#ffd166}.panel{background:#ffffff0e;border:1px solid #ffffff25;border-radius:18px;padding:18px;margin:16px 0}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,select{font:inherit;color:#fff;background:#322257;border:1px solid #ffffff45;border-radius:10px;padding:10px;cursor:pointer}button:hover{background:#6631a4}button:focus-visible,select:focus-visible{outline:2px solid #ffd166}svg{display:block;background:#fff;max-width:100%;height:auto;margin:18px auto;touch-action:none;cursor:crosshair}.status{min-height:1.5em;color:#ffd166}@media print{body{background:#fff;color:#111}.actions,a,p,.status{display:none}.panel{border:0;padding:0}h1{color:#111}svg{width:90vw;max-height:85vh}}
</style></head><body><main class="wrap"><a href="התחל כאן.html#games">← לכל ההפתעות</a><h1>🧩 מחולל מבוכים</h1><p>מייצרים מבוך חדש, מציירים דרך עם העכבר או האצבע, ומדפיסים לפתרון על נייר.</p><section class="panel"><div class="actions"><label>רמת קושי <select id="size"><option value="10">קל</option><option value="17" selected>בינוני</option><option value="25">מאתגר</option></select></label><button id="new">🎲 מבוך חדש</button><button id="reset">מחקו את הדרך</button><button id="solution">הציגו פתרון</button><button id="print">🖨️ הדפסה</button></div><svg id="maze" role="img" aria-label="מבוך: כניסה בפינה הימנית העליונה, יציאה בפינה השמאלית התחתונה"></svg><p id="status" class="status" role="status"></p></section></main><script>
const svg=document.getElementById('maze'),NS='http://www.w3.org/2000/svg',S=24,P=14;let n,cells,path=[],drawing=false;function el(tag,attrs){const e=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}function generate(){n=+document.getElementById('size').value;cells=Array.from({length:n*n},()=>({walls:[1,1,1,1],seen:false}));const stack=[0];cells[0].seen=true;while(stack.length){const i=stack.at(-1),x=i%n,y=Math.floor(i/n),opts=[[0,x,y-1,i-n,2],[1,x+1,y,i+1,3],[2,x,y+1,i+n,0],[3,x-1,y,i-1,1]].filter(([,a,b,j])=>a>=0&&a<n&&b>=0&&b<n&&!cells[j].seen);if(!opts.length){stack.pop();continue}const [wall,,,j,other]=opts[Math.floor(Math.random()*opts.length)];cells[i].walls[wall]=0;cells[j].walls[other]=0;cells[j].seen=true;stack.push(j)}cells[0].walls[0]=0;cells[n*n-1].walls[2]=0;path=[];render();document.getElementById('status').textContent='התחילו בכניסה למעלה מימין.'}function render(){const w=n*S+2*P;svg.setAttribute('viewBox',`0 0 ${w} ${w}`);svg.replaceChildren();let d='';for(let i=0;i<cells.length;i++){const x=P+(i%n)*S,y=P+Math.floor(i/n)*S,ws=cells[i].walls;if(ws[0])d+=`M${x} ${y}h${S}`;if(ws[1])d+=`M${x+S} ${y}v${S}`;if(ws[2])d+=`M${x} ${y+S}h${S}`;if(ws[3])d+=`M${x} ${y}v${S}`}svg.append(el('path',{d,stroke:'#271646','stroke-width':2.6,fill:'none','stroke-linecap':'square'}),el('text',{x:P+S/2,y:P+S/2+5,'text-anchor':'middle',fill:'#0b8776','font-size':13}));svg.lastChild.textContent='●';svg.append(el('text',{x:P+(n-.5)*S,y:P+(n-.5)*S+5,'text-anchor':'middle',fill:'#b02f73','font-size':13}));svg.lastChild.textContent='★';if(path.length){svg.append(el('polyline',{points:path.map(i=>`${P+(i%n+.5)*S},${P+(Math.floor(i/n)+.5)*S}`).join(' '),stroke:'#eb4c92','stroke-width':Math.max(3,S/5),fill:'none','stroke-linecap':'round','stroke-linejoin':'round'}))}}function hit(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse()),x=Math.floor((p.x-P)/S),y=Math.floor((p.y-P)/S);if(x<0||y<0||x>=n||y>=n)return;const i=y*n+x;if(!path.length){if(i===0)path=[0]}else if(i!==path.at(-1)){const last=path.at(-1),dx=x-last%n,dy=y-Math.floor(last/n),wall=dx===1?1:dx===-1?3:dy===1?2:dy===-1?0:-1;if(path.length>1&&i===path.at(-2))path.pop();else if(wall>=0&&!cells[last].walls[wall]&&!path.includes(i))path.push(i)}render();if(path.at(-1)===n*n-1){drawing=false;document.getElementById('status').textContent='🎉 מצאתם את היציאה!'}}svg.addEventListener('pointerdown',e=>{drawing=true;svg.setPointerCapture(e.pointerId);hit(e)});svg.addEventListener('pointermove',e=>{if(drawing)hit(e)});svg.addEventListener('pointerup',()=>drawing=false);svg.addEventListener('pointercancel',()=>drawing=false);document.getElementById('new').onclick=generate;document.getElementById('size').onchange=generate;document.getElementById('reset').onclick=()=>{path=[];render();document.getElementById('status').textContent='הדרך נמחקה.'};document.getElementById('solution').onclick=()=>{const parent=Array(n*n).fill(-1),queue=[0];parent[0]=0;for(let k=0;k<queue.length;k++){const i=queue[k],x=i%n,y=Math.floor(i/n);for(const [wall,j,valid]of [[0,i-n,y>0],[1,i+1,x<n-1],[2,i+n,y<n-1],[3,i-1,x>0]])if(valid&&!cells[i].walls[wall]&&parent[j]===-1){parent[j]=i;queue.push(j)}}path=[];for(let i=n*n-1;i!==0;i=parent[i])path.push(i);path.push(0);path.reverse();render();document.getElementById('status').textContent='הפתרון מוצג בוורוד.'};document.getElementById('print').onclick=()=>window.print();generate();
</script><script src="dl.js" defer></script></body></html>
